<div class="backdrop" (click)="close.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <div class="header">
      <h2>Settings</h2>
      <button class="x" (click)="close.emit()">
        <svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="row">
      <div class="label">Theme</div>
      <div class="options">
        <button
          *ngFor="let t of themes"
          class="option"
          [class.selected]="themeService.theme === t.value"
          (click)="themeService.set(t.value)">
          <svg *ngIf="t.value === 'light'" class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg *ngIf="t.value === 'dark'" class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          {{ t.label }}
        </button>
      </div>
    </div>
  </div>
</div>
