<div class="layout">
  <app-sidebar
    *ngIf="sidebarOpen"
    (chatSelected)="chatWindow?.scrollToBottom()"
    (openSettings)="settingsOpen = true">
  </app-sidebar>

  <main class="main">
    <header class="topbar">
      <button class="toggle" (click)="sidebarOpen = !sidebarOpen" title="Toggle sidebar">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span>Elector AI Assistant</span>
    </header>

    <app-chat-window></app-chat-window>
    <app-chat-input [disabled]="store.busy" (send)="send($event)"></app-chat-input>
  </main>

  <app-settings *ngIf="settingsOpen" (close)="settingsOpen = false"></app-settings>
</div>
